name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 푸시가 오면 진행 중인 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # prepare 스크립트(git config core.hooksPath)도 같이 도는데, CI 에서는 무해하다.
      - run: npm ci

      - name: Lint
        run: npm run lint

      # typecheck 스크립트가 next typegen 을 먼저 돌린다.
      # LayoutProps 같은 전역 타입은 Next 가 .next/types 에 생성하는 것이라
      # 갓 체크아웃한 상태에서 tsc 만 돌리면 "Cannot find name 'LayoutProps'" 로 깨진다.
      - name: Typecheck
        run: npm run typecheck

      # RLS 정책과 교사 뷰 회귀 테스트. pglite 라 DB 서비스가 필요 없다.
      - name: RLS tests
        run: npm run test:rls

      - name: Build
        run: npm run build
        # 빌드 시점에 읽히는 값들. 실제 비밀은 Vercel 에만 있고 CI 에는 넣지 않는다.
        # 모듈 스코프에서 env 를 읽는 코드가 나중에 들어와도 CI 가 깨지지 않게 미리 채워 둔다.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          ANSWER_WINDOW_SEC: "45"
          PASS_THRESHOLD: moderate
          POINTS_PER_PASS: "50"
